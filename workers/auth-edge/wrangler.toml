name = "kortix-auth-edge"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Routes - apply to all API requests
routes = [
  { pattern = "api.kortix.ai/v2/*", zone_name = "kortix.ai" }
]

# Environment variables (secrets set via wrangler secret)
[vars]
ENVIRONMENT = "production"

# KV namespace for caching JWKS
# Note: Create this namespace first with: wrangler kv:namespace create "JWKS_CACHE"
# Then replace the id below with the actual namespace ID
[[kv_namespaces]]
binding = "JWKS_CACHE"
id = "your-kv-namespace-id"

# Rate limiting
# Note: Rate limiting is available on Workers Paid plan
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 100, period = 60 }

# Development environment
[env.dev]
vars = { ENVIRONMENT = "development" }
routes = [
  { pattern = "api.dev.kortix.ai/v2/*", zone_name = "kortix.ai" }
]

# Staging environment
[env.staging]
vars = { ENVIRONMENT = "staging" }
routes = [
  { pattern = "api.staging.kortix.ai/v2/*", zone_name = "kortix.ai" }
]

# Production environment (same as default, but explicit)
[env.production]
vars = { ENVIRONMENT = "production" }
routes = [
  { pattern = "api.kortix.ai/v2/*", zone_name = "kortix.ai" }
]
